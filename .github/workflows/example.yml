name: example

# The permanent example pull request, "Example: what saidvsdid reports" (branch example/weakened-tests, never merged):
# it weakens the tests of examples/demo on purpose, and this job runs the Action on it as the README tells a user to:
# a published release pinned by its commit SHA (the README's), with its default (it blocks nothing). The README links that pull request and shows its comment
# (docs/img/comment.png). ci.yml's dogfood step leaves that branch to this job: one comment per pull request.

on:
  pull_request:
    paths: ['examples/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: example-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  saidvsdid:
    name: saidvsdid (the example pull request)
    if: github.head_ref == 'example/weakened-tests' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: JorgeAV99/saidvsdid@0632652478edc7a8e02cde641a3b17f62fc131fe # v0.1.0
