name: saidvsdid
description: 'What your coding agent did with the tests, in one PR comment: deleted, skipped or weakened tests.'
branding:
  icon: check-square
  color: orange

# The workflow gives the job its permissions (an action cannot): `pull-requests: write` to post the comment and
# `contents: read` to check out the code. The only token used is the job's own GITHUB_TOKEN. The checkout needs the
# whole history (`fetch-depth: 0`): the diff runs from where the pull request left its base branch to its head.
inputs:
  fail-on:
    description: "`none` (default): the check stays green whatever the verdict. `fail`: it fails on FAIL or worse (UNVERIFIABLE, ERROR). `warn`: it fails on WARN or worse."
    required: false
    default: none
  exclude:
    description: Paths to leave out of the analysis, one glob per line (for example test data that holds deliberately broken tests).
    required: false
    default: ''
  comment:
    description: "`true` (default): post one comment on the pull request and update it on every run. `false`: the job summary only."
    required: false
    default: 'true'

outputs:
  verdict:
    description: OK, WARN, FAIL, UNVERIFIABLE or ERROR.
    value: ${{ steps.check.outputs.verdict }}
  exit-code:
    description: The CLI's exit code for that verdict (0 OK, 1 WARN, 2 FAIL, 3 UNVERIFIABLE or ERROR).
    value: ${{ steps.check.outputs.exit-code }}
  comment-url:
    description: The PR comment's URL, empty when none was posted.
    value: ${{ steps.check.outputs.comment-url }}

runs:
  using: composite
  steps:
    # The CLI is built from this action's own source, at the ref the workflow names: no package is downloaded at run time
    # besides the npm dependencies its lockfile pins.
    - name: Build saidvsdid
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)' || { echo "::error::saidvsdid needs Node.js 20 or later (found $(node --version)): add actions/setup-node before it"; exit 1; }
        if [ ! -f dist/action/main.js ]; then
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          npm run build --silent
        fi
    - name: Check the pull request
      id: check
      shell: bash
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/dist/action/main.js"
